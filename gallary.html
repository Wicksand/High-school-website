<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111b2a">

  <title>Gallery · Thunder Ridge Football</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="all.css">
  <link rel="stylesheet" href="store.css">
  <link rel="stylesheet" href="gallery.css">
  <script src="all.js" defer></script>
  <script src="gallery.js" defer></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>

<body>
  <main>
    <section class="page-hero" aria-labelledby="gallery-title">
      <div class="wrap">
        <p class="eyebrow">FROM THE SIDELINES</p>
        <h1 id="gallery-title">Gallery</h1>
        <p class="page-hero-copy">Moments from practice, game days and everything in between.</p>
      </div>
    </section>

    <section class="section gallery-section">
      <div class="wrap">
        <div id="gallery-grid" class="gallery-grid" aria-live="polite">
          <p class="gallery-status">Loading photos…</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Enlarged photo viewer -->
  <dialog id="lightbox" class="lightbox" aria-label="Photo viewer">
    <button type="button" class="lightbox-close" aria-label="Close">×</button>
    <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous photo">‹</button>
    <figure class="lightbox-figure">
      <img id="lightbox-img" alt="">
      <figcaption>
        <span id="lightbox-caption"></span>
        <span id="lightbox-count" class="lightbox-count"></span>
      </figcaption>
    </figure>
    <button type="button" class="lightbox-nav lightbox-next" aria-label="Next photo">›</button>
  </dialog>

</body>
</html>
