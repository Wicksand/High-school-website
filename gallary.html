<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111b2a">
  <title>Gallery · Thunder Ridge Football</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="store.css">
  <link rel="stylesheet" href="gallery.css">
  <script src="gallery.js" defer></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>

<body>
  <header class="site-header">
    <div class="wrap header-main">
      <a class="brand" href="index.html#home" aria-label="Thunder Ridge Football home"><span class="brand-mark">TR</span><span><strong>THUNDER RIDGE</strong><small>FOOTBALL · TITANS</small></span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Site Menu</button>
      <nav id="main-nav" class="main-nav" aria-label="Main navigation">
        <!-- This is supposed to link to different pages in the site. Will optimize with javascript in the future. -->
        <!-- <a href="index.html#schedule">Calendar</a>
        <a href="index.html#programs">Teams</a>
        <a href="index.html#registration">Registration</a>
        <a href="store.html">Spiritwear</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="index.html#about">About</a> -->
        <a href="index.html">Home with Registration</a>
        <a href="storefront.html">Storefront</a>
        <a href="#">Gallery</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero" aria-labelledby="gallery-title">
      <div class="wrap">
        <p class="eyebrow">FROM THE SIDELINES</p>
        <h1 id="gallery-title">Gallery</h1>
        <p class="page-hero-copy">Moments from practice, game days and everything in between.</p>
      </div>
    </section>

    <section class="section gallery-section">
      <div class="wrap">
        <div id="gallery-grid" class="gallery-grid" aria-live="polite">
          <p class="gallery-status">Loading photos…</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Enlarged photo viewer -->
  <dialog id="lightbox" class="lightbox" aria-label="Photo viewer">
    <button type="button" class="lightbox-close" aria-label="Close">×</button>
    <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous photo">‹</button>
    <figure class="lightbox-figure">
      <img id="lightbox-img" alt="">
      <figcaption>
        <span id="lightbox-caption"></span>
        <span id="lightbox-count" class="lightbox-count"></span>
      </figcaption>
    </figure>
    <button type="button" class="lightbox-nav lightbox-next" aria-label="Next photo">›</button>
  </dialog>

  <footer class="site-footer"><div class="wrap footer-inner"><a class="brand brand-footer" href="index.html#home"><span class="brand-mark">TR</span><span><strong>THUNDER RIDGE FOOTBALL</strong><small>BOOSTER CLUB</small></span></a></div></footer>
</body>
</html>
